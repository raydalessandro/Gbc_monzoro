<!DOCTYPE html>
<html lang="it">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MERICCO — Cronache di Monzoro</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { height:100%; overflow:hidden; touch-action:none; }
  body {
    background: linear-gradient(160deg,#1a2b20 0%,#0d1a13 45%,#060d09 100%);
    font-family: "Courier New", monospace;
    display:flex; align-items:center; justify-content:center;
  }
  #console {
    width:100%; height:100%; max-width:520px;
    display:flex; flex-direction:column; align-items:center;
    padding:10px 8px calc(14px + env(safe-area-inset-bottom));
  }
  #bezel {
    background:#11181a; border-radius:12px 12px 34px 12px;
    padding:14px 14px 6px; box-shadow: inset 0 2px 6px rgba(0,0,0,.7), 0 4px 10px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    width:100%;
  }
  #screen {
    width:100%;
    aspect-ratio:10/9;
    max-height:52vh;
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:#0a140e; border:2px solid #05090b; border-radius:3px;
    display:block; margin:0 auto;
  }
  #bezeltxt { color:#8fa89a; font-size:11px; letter-spacing:2px; font-weight:bold; padding-bottom:4px; }
  #bezeltxt em { font-style:normal; color:#ccff33; }
  #controls {
    flex:1; width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:16px 6px 0; gap:8px;
  }
  #dpad { display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); }
  .dbtn {
    background:#1c2а26; background:#1c2a26; border:none; border-radius:8px; color:#7d9b8a; font-size:22px;
    box-shadow:0 3px 0 #0b1310; display:flex; align-items:center; justify-content:center;
  }
  .dbtn:active,.dbtn.on { background:#2c4436; transform:translateY(2px); box-shadow:0 1px 0 #0b1310; }
  #dU{grid-area:1/2}#dL{grid-area:2/1}#dC{grid-area:2/2;border-radius:0;pointer-events:none;background:#1c2a26}#dR{grid-area:2/3}#dD{grid-area:3/2}
  #abwrap { display:flex; gap:18px; transform:rotate(-20deg); padding-right:6px; }
  .ab {
    width:64px; height:64px; border-radius:50%; border:none;
    background:#9dc428; color:#1a2408; font-size:22px; font-weight:bold; font-family:inherit;
    box-shadow:0 4px 0 #4d6114;
  }
  .ab:active,.ab.on { transform:translateY(3px); box-shadow:0 1px 0 #4d6114; }
  #btnB { margin-top:26px; }
</style>
</head>
<body>
<div id="console">
  <div id="bezel">
    <canvas id="screen" width="160" height="144"></canvas>
    <div id="bezeltxt">MERICCO <em>MONZORO</em></div>
  </div>
  <div id="controls">
    <div id="dpad">
      <button class="dbtn" id="dU">▲</button>
      <button class="dbtn" id="dL">◀</button>
      <div class="dbtn" id="dC"></div>
      <button class="dbtn" id="dR">▶</button>
      <button class="dbtn" id="dD">▼</button>
    </div>
    <div id="abwrap">
      <button class="ab" id="btnB">B</button>
      <button class="ab" id="btnA">A</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ==========================================================
   MERICCO — CRONACHE DI MONZORO  (edizione Game Boy Color)
   Una notte, sette della crew, un paese intero.
   Stesso motore di Avventura Color / Isola dei Tre Venti.
   ========================================================== */

const cv = document.getElementById("screen");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

/* ---------- PALETTE ---------- */
const PAL = {
  K:"#0e1210", R:"#d04838", B:"#3868c8", S:"#e8c090", D:"#3a4038",
  W:"#e8e4d8", G:"#3f9a4f", L:"#8fce62", Y:"#ffd15a", O:"#ff7a33",
  P:"#e878a8", A:"#9aa0aa", V:"#ccff33", U:"#d7a7ff"
};

function makeSprite(rows, mirror=false){
  const c = document.createElement("canvas"); c.width=16; c.height=16;
  const g = c.getContext("2d");
  for(let y=0;y<16;y++){
    const row = rows[y]||"";
    for(let x=0;x<16;x++){
      const ch = row[mirror?15-x:x];
      if(ch && ch!=="."){ g.fillStyle=PAL[ch]||"#000"; g.fillRect(x,y,1,1); }
    }
  }
  return c;
}

/* ---------- SPRITE BASE (l'Ottavo) ---------- */
const pDown0 = [
"................",
".....KKKKKK.....",
"....KRRRRRRK....",
"...KRRRRRRRRK...",

".....KK..KK....."];
const pDown1 = pDown0.slice(0,13).concat([
".....KBBBBK.....",
"....KDK.KDK.....",
"....KK....K....."]);
const pUp0 = [
"................",
".....KKKKKK.....",
"....KRRRRRRK....",
"...KRRRRRRRRK...",
"...KRRDDDDRRK...",
"...KKKKKKKKKK...",
"...KDDDDDDDDK...",
"...KDDDDDDDDK...",
"....KDDDDDDK....",
".....KKKKKK.....",
"....KBBBBBBK....",
"...KSBBBBBBSK...",
"...KKBBBBBBKK...",
".....KBBBBK.....",
".....KDKKDK.....",
".....KK..KK....."];
const pUp1 = pUp0.slice(0,13).concat([
".....KBBBBK.....",
"....KDK.KDK.....",
"....KK....K....."]);
const pSide0 = [
"................",
".....KKKKK......",
"....KRRRRRK.....",
"...KRRRRRRK.....",
"...KRRRRRRRK....",
"...KKKKKKKK.....",
"...KSKSSSKK.....",
"...KSSSSSK......",
"....KSSSK.......",
".....KKKK.......",
"....KBBBBK......",
"....KBBBBSK.....",
"....KBBBBK......",
".....KBBK.......",
".....KDDK.......",
".....KKKK......."];
const pSide1 = pSide0.slice(0,13).concat([
".....KBBK.......",
"....KDKKDK......",
"....KK..KK......"]);
function makeCharSet(m){
  const rc=rows=>rows.map(s=>s.split("").map(c=>m[c]||c).join(""));
  const d0=rc(pDown0),d1=rc(pDown1),u0=rc(pUp0),u1=rc(pUp1),s0=rc(pSide0),s1=rc(pSide1);
  return {
    down:[makeSprite(d0),makeSprite(d1),makeSprite(d0),makeSprite(d1,true)],
    up:[makeSprite(u0),makeSprite(u1),makeSprite(u0),makeSprite(u1,true)],
    left:[makeSprite(s0),makeSprite(s1),makeSprite(s0),makeSprite(s1)],
    right:[makeSprite(s0,true),makeSprite(s1,true),makeSprite(s0,true),makeSprite(s1,true)]
  };
}
const SPR = makeCharSet({});

/* ---------- LA CREW ---------- */
const CREWDEF = {
  marro:  {name:"MARRO",  col:"#ccff33", cm:{R:"V",B:"D"}, x:25,y:20, home:"Base Mericco"},
  polli:  {name:"POLLI",  col:"#73dc63", cm:{R:"G",B:"L"}, x:8, y:9,  home:"La Serra"},
  bisi:   {name:"BISI",   col:"#ff7a33", cm:{R:"O",B:"D"}, x:42,y:22, home:"Via Milano"},
  dani:   {name:"DANI",   col:"#4aa8ff", cm:{R:"B",B:"W"}, x:36,y:26, home:"Campetto a 5"},
  luchino:{name:"LUCHINO",col:"#d7a7ff", cm:{R:"U",B:"D"}, x:30,y:40, home:"S. Maria Rossa"},
  lollo:  {name:"LOLLO",  col:"#ffd15a", cm:{R:"Y",B:"D"}, x:36,y:10, home:"Lago Monzoro"},
  cino:   {name:"CINO",   col:"#ff596a", cm:{R:"R",B:"G"}, x:7, y:16, home:"Cascina Pobbiera"}
};
const CHARS = Object.keys(CREWDEF).map(id=>{
  const d=CREWDEF[id];
  return {id, name:d.name, col:d.col, x:d.x, y:d.y, hx:d.x, hy:d.y, dir:"down", spr:makeCharSet(d.cm)};
});
const charAt=(x,y)=>CHARS.find(c=>c.x===x&&c.y===y);
const BASE_CREW = Object.keys(CREWDEF);

/* ---------- REGISTRI DI ESTENSIONE ----------
   I moduli in fondo al file si agganciano qui, senza toccare il core. */
const TALK_HANDLERS = {};   // id personaggio -> fn(char, stato)
const MINIGAMES     = {};   // nome modalita'  -> {update(), draw()}
const MAP_HOOKS     = [];   // fn(x,y)        -> a ogni casella raggiunta
const DRAW_HOOKS    = [];   // fn(camX,camY)  -> disegna sopra la mappa
const STAT_LINES    = [];   // fn() -> stringa per la pagina 2 del diario
function registerTalk(id,fn){ TALK_HANDLERS[id]=fn; }
function registerMinigame(name,o){ MINIGAMES[name]=o; }
function onStep(fn){ MAP_HOOKS.push(fn); }
function onDrawMap(fn){ DRAW_HOOKS.push(fn); }
function addStatLine(fn){ STAT_LINES.push(fn); }
function addCrew(id,def){
  CREWDEF[id]=def;
  if(crew[id]===undefined) crew[id]=(saved&&saved.crew&&saved.crew[id])|0;
  CHARS.push({id, name:def.name, col:def.col, x:def.x, y:def.y,
              hx:def.x, hy:def.y, dir:"down", spr:makeCharSet(def.cm)});
}

/* ---------- LA MAPPA (Monzoro di notte, verificata) ---------- */
const MAP = [
"TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT",
"TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT",
"T.......................p..........................T",
"T.......................p.........wwwwwwwww........T",
"T.....vvvvvv............p........wwwwwwwwwwwwwwww..T",
"T.....vvvvvv......tttt..p........wwwwwwwwwwwwwwww..T",
"T.....vvvvvv......tttt.lp........wwwwwwwwwwwwwwww..T",
"T.......................p........wwwwwwwwwwwwwwww..T",
"T.....,,,...............ppplppppppwwwwwwwwwwwwwww..T",

"T...,,,,,,,,,.,,,,,,,...p..........................T",
"T...,RRRRR,,,.,,,,,,,...pl...................tttt..T",
"T....RRRRR..............b....................tttt..T",
"T....WWWWWl..b..........p....................tttt..T",
"T....dddddddddddddddddddd..........................T",
"T...............l....s..p..........................T",
"T....................rrrrrrr...RRRR........RRRR....T",
"T.............ww.....rrrrrrr...RRRR..RRRR..RRRR....T",
"T.............ww.....WWWpWWW...WWWW..RRRR..WWWW....T",
"T..ttt...GGGGGdd........p...........lWWWW.b........T",
"T..ttt...GGGGGww........pppplppppppppppppppppppppp.T",
"T..ttt...GGGGGww..............p.............l......T",
"T........GGGGGww..............p..RRRR.b............T",
"T.............ww..............p..RRRR...RRRR...b...T",
"T.........l...ww.............lp..WWWW...RRRR.......T",
"T....ddddddd.dddddddddddddddddd.........WWWW.......T",
"T.......b.......GGGGG.........p.fffffffffb.........T",
"T...............GGGGG.........p..gggggggf..........T",
"T...............GGGGGttt......p.fgggggggf..........T",
"T....................ttt......p.fgggggggf..........T",
"T...TTTTTTTT.TTTTTTTT.........plfgggggggf..........T",
"T...TTTTTTTT.TTTTTTTT.........p.fffffffff..........T",
"T...TTTTTTTT.TTTTTTTT.......b.p.............GGGGG..T",
"T...TT............TTT.........x.....ttt.....GGGGG..T",
"T...TTTTTTTTTTTTTTTTT........RRR....ttt.....GGGGG..T",
"T...TTTTTTTTTTTTTTTTT......RRRpRRR..........GGGGG..T",
"T...TTTTTTTTTTTTTTTTT......ccccccc.................T",
"T...TTTTTTTTTTTTTTTTT......ccccccc.................T",
"T...TTTTTTTTTTTTTTTTT.........p....................T",
"T...TTTTTTTTTTTTTTTTT.........p....................T",
"T...TTTTTTTTTTTTTTTTT..............................T",
"TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT",
"TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"];
const MW = 52, MH = MAP.length;
const tileAt = (x,y)=> (x<0||y<0||x>=MW||y>=MH) ? "T" : (MAP[y][x]||"T");
const SOLID = new Set(["T","w","R","r","W","c","v","f","b","s","l","x"]);

/* ---------- MURI DI BISI e collezionabili ---------- */
const MURI = [
  {id:"m1",x:24,y:13,label:"SOTTOPASSO MARCONI"},
  {id:"m2",x:42,y:20,label:"MURO VIA MILANO"},
  {id:"m3",x:38,y:23,label:"CABINA VIA GERLI"},
  {id:"m4",x:41,y:27,label:"RECINZIONE CAMPETTO"},
  {id:"m5",x:8, y:27,label:"MAGAZZINO CORTE NUOVA"},
  {id:"m6",x:13,y:14,label:"PONTE POBBIERA"},
  {id:"m7",x:28,y:33,label:"MURETTO DE GASPERI"},
  {id:"m8",x:47,y:24,label:"CURVA STIGLIANO"}
];
const TAPPI = [[20,3],[46,3],[3,8],[28,12],[49,15],[18,22],[3,25],[44,29],[26,31],[7,34],[16,34],[45,38]];
const BARRE = [[2,2,"CONFINE"],[49,10,"NEON"],[2,30,"PROVINCIA"],[12,33,"LUNA"],[48,41,"MATTONI"],[22,35,"ROGGIA"]];
const CASSETTE = [[7,15],[16,20],[31,8]];
const PAROLE = [[34,10,"ACQUA"],[30,33,"ASFALTO"],[9,10,"FUMO"],[22,20,"ALBA"]];
const SCIARPA_POS = [28,20];
const ANELLI = [[10,15],[9,9],[31,8],[40,21],[36,26],[30,39],[12,34],[24,19]];

/* ---------- AUDIO ---------- */
let AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); }
function beep(freq,dur,delay=0,vol=0.12,type="square"){
  if(!AC)return;
  const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination); o.start(t);o.stop(t+dur);
}
const sfx = {
  a:()=>beep(880,.07), b:()=>beep(440,.07),
  pad:i=>beep(330+i*115,.1,0,.08,"sine"),
  hit:()=>beep(760,.12), miss:()=>beep(145,.16,0,.1,"sawtooth"),
  pick:()=>{beep(660,.07);beep(990,.09,.07);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>beep(f,.12,i*.085));},
  beat:()=>beep(92,.12,0,.14),
  msg:()=>beep(980,.04,0,.06)
};

/* ---------- STATO ---------- */
const NOME = "OTTAVO";
let crew = {marro:0, polli:0, bisi:0, dani:0, luchino:0, lollo:0, cino:0};
let prologue=false, finalDone=false;
let tags=[], caps=[], bars=[], crates=[], words=[];
let sciarpa=false, ringIdx=0, respect=0;
const pronti = ()=> ["polli","bisi","dani","luchino","lollo","cino"].filter(k=>crew[k]>=2).length;

function loadSave(){
  try{ const d=JSON.parse(localStorage.getItem("monzoro-save"));
    if(d && d.crew) return d; }catch(e){} return null;
}
function doSave(){
  try{ localStorage.setItem("monzoro-save", JSON.stringify({
    crew, prologue, finalDone, tags, caps, bars, crates, words,
    sciarpa, ringIdx, respect, ext:EXT, x:player.x, y:player.y })); }catch(e){}
}
/* stato libero dei moduli: ogni modulo si prende la sua chiave in EXT */
let EXT = {};

const TS=16, VW=160, VH=144;
const player = { x:24, y:22, dir:"up", ox:0, oy:0, moving:false, step:0, animT:0 };
const saved=loadSave();
if(saved){
  crew=Object.assign(crew,saved.crew);
  prologue=!!saved.prologue; finalDone=!!saved.finalDone;
  tags=saved.tags||[]; caps=saved.caps||[]; bars=saved.bars||[];
  crates=saved.crates||[]; words=saved.words||[];
  sciarpa=!!saved.sciarpa; ringIdx=saved.ringIdx|0; respect=saved.respect|0;
  if(!SOLID.has(tileAt(saved.x,saved.y)) && !charAt(saved.x,saved.y)){ player.x=saved.x; player.y=saved.y; }
  EXT = saved.ext || {};
}

const keys={up:false,down:false,left:false,right:false};
let mode="map";  // map | dialog | diario | simon | timing | arrows | quiz | ending
let dialog=null, scene=null;
let tick=0, aPressed=false, bPressed=false, dirTapped=null;
let toastMsg=null, toastT=0;
let mini=null;
let diarioPage=0;
const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};

function toast(m){ toastMsg=m; toastT=150; sfx.pick(); }
function openDialog(lines,extra){ sfx.msg(); mode="dialog"; dialog=Object.assign({lines},extra||{}); }
function playScene(boxes,endFn){ scene={q:boxes.slice(1),end:endFn||null}; openDialog(boxes[0].lines,boxes[0]); }

/* ---------- INPUT ---------- */
function bindHold(id,name){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();audio();keys[name]=true;el.classList.add("on");dirTapped=name;};
  const off=e=>{e.preventDefault();keys[name]=false;el.classList.remove("on");};
  el.addEventListener("touchstart",on,{passive:false});
  el.addEventListener("touchend",off); el.addEventListener("touchcancel",off);
  el.addEventListener("mousedown",on); el.addEventListener("mouseup",off); el.addEventListener("mouseleave",off);
}
bindHold("dU","up"); bindHold("dD","down"); bindHold("dL","left"); bindHold("dR","right");
function bindTap(id,fn){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();audio();el.classList.add("on");fn();};
  const off=e=>{e.preventDefault();el.classList.remove("on");};
  el.addEventListener("touchstart",on,{passive:false});
  el.addEventListener("touchend",off); el.addEventListener("touchcancel",off);
  el.addEventListener("mousedown",on); el.addEventListener("mouseup",off);
}
bindTap("btnA",()=>{aPressed=true;});
bindTap("btnB",()=>{bPressed=true;});
window.addEventListener("keydown",e=>{
  audio();
  if(e.repeat){
    if(e.key==="ArrowUp")keys.up=true; if(e.key==="ArrowDown")keys.down=true;
    if(e.key==="ArrowLeft")keys.left=true; if(e.key==="ArrowRight")keys.right=true;
    return;
  }
  if(e.key==="ArrowUp"){keys.up=true;dirTapped="up";}
  if(e.key==="ArrowDown"){keys.down=true;dirTapped="down";}
  if(e.key==="ArrowLeft"){keys.left=true;dirTapped="left";}
  if(e.key==="ArrowRight"){keys.right=true;dirTapped="right";}
  if(e.key==="z"||e.key==="Z"||e.key===" "||e.key==="Enter")aPressed=true;
  if(e.key==="x"||e.key==="X")bPressed=true;
});
window.addEventListener("keyup",e=>{
  if(e.key==="ArrowUp")keys.up=false; if(e.key==="ArrowDown")keys.down=false;
  if(e.key==="ArrowLeft")keys.left=false; if(e.key==="ArrowRight")keys.right=false;
});
document.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- TILESET NOTTURNO ---------- */
function makeTile(fn){
  return [0,1].map(f=>{
    const c=document.createElement("canvas");c.width=16;c.height=16;
    fn(c.getContext("2d"),f); return c;
  });
}
const px=(g,c,x,y,w=1,h=1)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
const nightGrass=g=>{ px(g,"#26402a",0,0,16,16);
  [[3,4],[11,2],[7,9],[13,12],[2,13],[9,6]].forEach(([x,y])=>px(g,"#1e3522",x,y,2,1)); };
const TILES = {
  ".": makeTile(g=>nightGrass(g)),
  ",": makeTile(g=>{ px(g,"#20361f",0,0,16,16);
      for(let i=0;i<4;i++) px(g,"#2c4a28",0,2+i*4,16,2); px(g,"#182a18",0,15,16,1); }),
  "t": makeTile((g,f)=>{ nightGrass(g);
      g.fillStyle="#182e1d";
      for(let i=0;i<4;i++){ const x=i*4+(f?1:0);
        g.fillRect(x,6,1,9); g.fillRect(x+1,4,1,11); g.fillRect(x+2,7,1,8); }
      px(g,"#10231a",0,14,16,2); }),
  "p": makeTile(g=>{ px(g,"#3a3f44",0,0,16,16);
      px(g,"#6a6f74",7,2,2,4); px(g,"#6a6f74",7,10,2,4);
      px(g,"#2c3136",0,0,16,1); px(g,"#2c3136",0,15,16,1); }),
  "d": makeTile(g=>{ px(g,"#4a4132",0,0,16,16);
      [[3,4],[12,6],[6,11],[10,2],[14,12]].forEach(([x,y])=>px(g,"#3c3528",x,y,2,1));
      px(g,"#3a3326",0,15,16,1); }),
  "T": makeTile(g=>{ nightGrass(g);
      px(g,"#0f2416",1,0,14,10); px(g,"#14301c",2,1,12,7);
      px(g,"#1d4426",3,2,4,2); px(g,"#1d4426",9,3,3,2);

function missione(){
  if(!prologue) return ["Raggiungi MARRO","alla Base Mericco."];
  if(crew.cino===1) return ["Il giro di CINO:","anello "+(ringIdx+1)+"/8 (rosso)."];
  if(crew.polli===1) return ["Cassette di POLLI:","trovate "+crates.length+"/3."];
  if(crew.dani===1) return [ sciarpa?"Porta la SCIARPA":"La SCIARPA e' fuori","al campetto da DANI."];

/* ---------- MINIGIOCHI ---------- */
function startSimon(){
  mini={seq:[Math.random()*4|0,Math.random()*4|0,Math.random()*4|0],
        phase:"show", showI:0, showT:30, cur:0, idx:0, round:1, err:0};
  mode="simon"; sfx.a();
}
function updateSimon(){
  const m=mini;
  if(m.phase==="show"){
    m.showT--;
    if(m.showT<=0){
      if(m.showI<m.seq.length-1){ m.showI++; m.showT=30; sfx.pad(m.seq[m.showI]); }
      else { m.phase="play"; m.idx=0; }
    }
    return;
  }
  if(dirTapped==="left"&&m.cur>0){m.cur--;sfx.b();}
  if(dirTapped==="right"&&m.cur<3){m.cur++;sfx.b();}
  if(aPressed){
    sfx.pad(m.cur);
    if(m.seq[m.idx]!==m.cur){
      m.err++; m.idx=0; m.phase="show"; m.showI=0; m.showT=34; sfx.miss();
      return;
    }
    m.idx++;
    if(m.idx>=m.seq.length){
      if(m.round>=3){
        mode="map"; mini=null;
        crew.polli=1; respect+=25; doSave(); sfx.win();
        playScene([
          {lines:["POLLI: Eccolo, il","basso del pezzo!","Era nelle lampade","da sempre."]},
          {lines:["Ora le 3 CASSETTE","verdi: Pobbiera,","roggia e strada","del lago. Vai!"]}
        ]);
        return;
      }
      m.round++; m.seq.push(Math.random()*4|0);
      m.phase="show"; m.showI=0; m.showT=40; m.idx=0;
    }
  }
  if(bPressed){ mode="map"; mini=null; sfx.b(); }
}
function drawSimon(){
  const m=mini;
  ctx.fillStyle="#0d1f16"; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle="#73dc63"; ctx.font="bold 9px 'Courier New',monospace"; ctx.textBaseline="top";
  ctx.fillText("IL RITMO DELLA SERRA",8,5);
  ctx.fillStyle="#8fa89a"; ctx.font="bold 8px 'Courier New',monospace";
  ctx.fillText("GIRO "+m.round+"/3   "+(m.phase==="show"?"ASCOLTA...":"RIPETI!"),8,17);
  const cols=["#55d66b","#8ef08a","#d2ff66","#2ebd77"];
  for(let i=0;i<4;i++){
    const x=10+i*37, y=48;
    const lit = (m.phase==="show" && m.seq[m.showI]===i && m.showT>10);
    ctx.fillStyle = lit ? "#ffffff" : cols[i];
    ctx.fillRect(x,y,30,40);
    ctx.strokeStyle = (m.phase==="play"&&i===m.cur)?"#ffd15a":"#0e1210";
    ctx.lineWidth=(m.phase==="play"&&i===m.cur)?3:2;
    ctx.strokeRect(x+1,y+1,28,38);
  }
  ctx.fillStyle="#8fa89a";
  ctx.fillText("PROGRESSO: "+"◆".repeat(m.idx)+"◇".repeat(m.seq.length-m.idx),8,100);
  ctx.fillText("A: suona  B: torno dopo",8,132);
}

const TIMING_CFG = {
  dani: {title:"CINQUE RIGORI SOTTO I LAMPIONI", total:5, need:3, zone:17, lives:0, btn:"TIRA"},
  lollo:{title:"GEOMETRIA DELLA BIRRA", total:7, need:7, zone:24, lives:3, narrow:2, btn:"MOLLA LA CASSA"},
  final:{title:"SOUNDCHECK DEL MERICCO", total:16, need:10, zone:15, lives:0, btn:"BATTITO"}
};
function startTiming(kind){
  const c=TIMING_CFG[kind];
  mini={kind, cfg:c, x:0, dir:1, shots:0, hits:0, lives:c.lives, msg:"", speed: kind==="final"?3.4:2.4};
  mode="timing"; sfx.a();
}
function timingWin(){
  const k=mini.kind; mode="map"; mini=null; sfx.win();
  if(k==="dani"){
    crew.dani=1; respect+=25; doSave();
    playScene([
      {lines:["DANI: Tre dentro.","Il rigore decisivo","era studiato,","ovviamente."]},
      {lines:["Ma la SCIARPA","nerazzurra e' rimasta","fuori dal Mericco.","Recuperala!"]}
    ]);
  } else if(k==="lollo"){
    crew.lollo=2; respect+=70; doSave();
    playScene([
      {lines:["LOLLO: Sette casse","in equilibrio.","Una geometria","quasi sacra."]},
      {lines:["Al Mericco ci","arrivo prima","dell'alba. LOLLO","E' PRONTO!"]}
    ]);
  } else {
    finalDone=true; crew.marro=2; respect+=100; doSave();
    mode="ending"; sfx.win();
  }
}
function updateTiming(){
  const m=mini, c=m.cfg;
  m.x += m.dir*m.speed;
  if(m.x>=100||m.x<=0){ m.dir*=-1; m.x=Math.max(0,Math.min(100,m.x)); }
  if(aPressed && m.shots<c.total){
    const zone = c.narrow ? Math.max(9, c.zone - m.hits*c.narrow) : c.zone;
    const hit = Math.abs(m.x-50)<=zone;
    if(m.kind==="final") sfx.beat(); else (hit?sfx.hit():sfx.miss());
    if(hit){ m.hits++; m.shots++; m.msg = m.kind==="dani"?"GOL!":(m.kind==="lollo"?"PRESA!":"PULITO"); }
    else {
      m.shots++; m.msg = m.kind==="dani"?"ALTO SOPRA LA RETE":"SCIVOLATA...";
      if(c.lives){ m.lives--; m.shots--; if(m.lives<=0){ m.shots=0;m.hits=0;m.lives=c.lives;m.msg="SI RIPARTE."; } }
    }
    if(m.kind==="lollo" && m.hits>=c.total){ timingWin(); return; }
    if(m.shots>=c.total){
      if(m.hits>=c.need){ timingWin(); return; }
      m.msg="NON BASTA. A: RIPROVA"; m.retry=true;
    }
  }
  if(aPressed && m.retry){ m.shots=0;m.hits=0;m.retry=false;m.msg="";
    if(m.cfg.lives)m.lives=m.cfg.lives; }
  if(bPressed){ mode="map"; mini=null; sfx.b(); }
}
function drawTiming(){
  const m=mini, c=m.cfg;
  ctx.fillStyle="#10151c"; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle = m.kind==="dani"?"#4aa8ff":(m.kind==="lollo"?"#ffd15a":"#ccff33");
  ctx.font="bold 8px 'Courier New',monospace"; ctx.textBaseline="top";
  ctx.fillText(c.title,8,5);
  ctx.fillStyle="#8fa89a";
  const label = m.kind==="lollo" ? ("CASSE "+m.hits+"/"+c.total+"  VITE "+"●".repeat(m.lives))
    : (m.kind==="final" ? ("COLPI "+String(m.shots).padStart(2,"0")+"/16  PULITI "+m.hits)
    : ("TIRI "+m.shots+"/"+c.total+"  GOL "+m.hits));
  ctx.fillText(label,8,18);
  // barra
  const zone = c.narrow ? Math.max(9, c.zone - m.hits*c.narrow) : c.zone;
  const bx=10, bw=140, by=64;
  ctx.fillStyle="#2a2f36"; ctx.fillRect(bx,by,bw,14);
  ctx.fillStyle="#2ebd77"; ctx.fillRect(bx+bw*(50-zone)/100,by,bw*zone*2/100,14);
  ctx.fillStyle="#ffffff"; ctx.fillRect(bx+bw*m.x/100-1,by-4,3,22);
  ctx.strokeStyle="#0e1210"; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,14);
  ctx.fillStyle="#e8e4d8"; ctx.font="bold 9px 'Courier New',monospace";
  ctx.fillText(m.msg||"",8,96);
  ctx.fillStyle="#8fa89a"; ctx.font="bold 8px 'Courier New',monospace";
  ctx.fillText("A: "+c.btn+"  B: esci",8,132);
}

function startQuiz(){ mini={i:0, sel:0, okN:0}; mode="quiz"; sfx.a(); }
function updateQuiz(){
  const m=mini;
  if(dirTapped==="up"&&m.sel>0){m.sel--;sfx.b();}
  if(dirTapped==="down"&&m.sel<2){m.sel++;sfx.b();}

/* ---------- PARLARE CON LA CREW ---------- */
function talk(c){
  const opp={up:"down",down:"up",left:"right",right:"left"};
  c.dir=opp[player.dir];
  const id=c.id, st=crew[id];
  if(id==="marro"){
    if(!prologue){
      playScene([
        {lines:["MARRO: "+NOME+".","Monzoro sembra piccolo","solo a chi lo","attraversa in macchina."]},
        {lines:["A piedi e' un","continente. Stanotte","facciamo una cosa","che resti."]},
        {lines:["Polli e' alla serra.","Dani al campetto.","Luchino giu' alla","chiesa. Gli altri..."]},
        {lines:["...segui il rumore.","Riportali tutti","qui prima dell'alba!"]}
      ], ()=>{ prologue=true; doSave(); toast("MISSIONE: RIUNISCI LA CREW"); });
      return;
    }
    if(finalDone){ mode="ending"; sfx.a(); return; }
    if(pronti()>=6){
      playScene([
        {lines:["MARRO: Ci sono","tutti. Perfino Dani","ha smesso di parlare","del rigore."]},
        {lines:["Manca il soundcheck.","Sedici battiti: se li","teniamo insieme,","Monzoro arriva all'alba."]}
      ], ()=>startTiming("final"));
      return;
    }
    const manca=["polli","bisi","dani","luchino","lollo","cino"].filter(k=>crew[k]<2)
      .map(k=>CREWDEF[k].name).join(", ");
    openDialog(["MARRO: "+pronti()+" su 6","sono pronti.","Mancano: ",manca+"."]);
    return;
  }
  if(!prologue){ openDialog([c.name+": Prima passa","da MARRO al Mericco.","Ha quella faccia da","piano troppo grande."]); return; }
  if(TALK_HANDLERS[id]){ TALK_HANDLERS[id](c, st); return; }
  if(id==="polli"){
    if(st===0){
      playScene([
        {lines:["POLLI: Le piante","stanno benissimo.","Sono io che ho","perso il filo."]},
        {lines:["Le lampade fanno","una sequenza: dentro","c'e' il basso del","pezzo. Ripetila!"]}
      ], startSimon);
    }
    else if(st===1 && crates.length<3) openDialog(["POLLI: Mancano "+(3-crates.length),"cassette verdi.","Pobbiera, roggia e","strada del lago."]);
    else if(st===1){
      crew.polli=2; respect+=45; doSave(); sfx.win();
      openDialog(["POLLI: Eccole! Ho","campionato il ronzio.","Suona meglio a 84 BPM.","POLLI E' PRONTO! ✔"]);
    }
    else openDialog(["POLLI: Il beat","respira. O forse","sono le ventole.","Va bene tutto."]);
    return;
  }
  if(id==="bisi"){
    if(st===0){
      playScene([
        {lines:["BISI: Un muro vuoto","e' una domanda","scritta male."]},
        {lines:["Te ne ho segnati 8","(quadrati arancioni).","Cinque firme bastano","per la notte."]}
      ], ()=>{ crew.bisi=1; doSave(); toast("FIRMA ALMENO 5 MURI"); });
    }
    else if(st===1 && tags.length<5) openDialog(["BISI: Ne hai chiusi","solo "+tags.length+". Me ne","servono cinque.","Cerca l'arancione."]);
    else if(st===1){
      crew.bisi=2; respect+=45; doSave(); sfx.win();
      openDialog(["BISI: Cinque muri,","una sola grafia.","Monzoro ha il suo","carattere. PRONTO! ✔"]);
    }
    else openDialog([tags.length>=8?"BISI: Otto su otto.":"BISI: Cinque bastavano.",
      tags.length>=8?"Persino i muri":"Gli altri tre, pero',",
      tags.length>=8?"secondari hanno":"ci stanno ancora",
      tags.length>=8?"una carriera.":"guardando."]);
    return;
  }
  if(id==="dani"){
    if(st===0){
      playScene([
        {lines:["DANI: Cinque rigori.","Porta piccola,","pressione enorme.","Come piace a noi."]},
        {lines:["Segnane almeno tre.","E non tirare piano:","il blu e il nero non","passano al portiere."]}
      ], ()=>startTiming("dani"));
    }

function mapInteract(){
  const [dx,dy]=DIRV[player.dir];
  const fx=player.x+dx, fy=player.y+dy;
  const c=charAt(fx,fy);
  if(c){ talk(c); return; }
  const t=tileAt(fx,fy);
  if(t==="b"){
    const w=MURI.find(w=>w.x===fx&&w.y===fy);
    if(!w) return;
    if(crew.bisi===0) openDialog(["Una superficie vuota.","Bisi saprebbe","peggiorarla nel","modo giusto."]);
    else if(tags.includes(w.id)) openDialog(["Firma di BISI.","Vernice fresca.","Da lontano sembra","quasi autorizzata."]);
    else startArrows(w.id);
  }
  else if(t==="s") openDialog(["BASE MERICCO","Il punto in cui la","crew si ritrova","da sempre."]);
  else if(t==="v") openDialog(["La Serra di Polli.","Brilla di verde anche","quando tutto il","resto dorme."]);
  else if(t==="w") openDialog(["L'acqua di Monzoro.","Di notte sembra","molto piu' grande."]);
  else if(t==="c"||t==="x") openDialog(["Santa Maria Rossa:","mattoni, campi e","secoli di silenzio."]);
  else if(t==="g"||t==="f") openDialog(["Il campetto a 5.","Dani lo chiama","San Siro Ovest","quando vince."]);
  else if(t==="l") openDialog(["Un lampione tiene","accesa la sua","porzione di notte."]);
}

/* ---------- MOVIMENTO ---------- */
function heldDir(){
  if(keys.up)return "up"; if(keys.down)return "down";
  if(keys.left)return "left"; if(keys.right)return "right"; return null;
}
function tryMove(dir){
  player.dir=dir;
  const [dx,dy]=DIRV[dir], nx=player.x+dx, ny=player.y+dy;
  if(SOLID.has(tileAt(nx,ny)) || charAt(nx,ny)) return;
  player.moving=true; player.step=0;
}
function finishMove(){
  const [dx,dy]=DIRV[player.dir];
  player.x+=dx; player.y+=dy; player.moving=false; player.ox=0; player.oy=0;
  const X=player.x, Y=player.y;
  // tappi
  TAPPI.forEach((p,i)=>{
    if(!caps.includes(i) && p[0]===X && p[1]===Y){
      caps.push(i); respect+=3; toast("TAPPO NASCOSTO "+caps.length+"/"+TAPPI.length);
    }
  });
  // barre segrete
  BARRE.forEach((p,i)=>{
    if(!bars.includes(i) && p[0]===X && p[1]===Y){
      bars.push(i); respect+=5; toast("BARRA «"+p[2]+"» "+bars.length+"/"+BARRE.length);
    }
  });
  // cassette di Polli
  if(crew.polli===1) CASSETTE.forEach((p,i)=>{
    if(!crates.includes(i) && p[0]===X && p[1]===Y){
      crates.push(i); respect+=8;
      toast(crates.length>=3?"3/3 CASSETTE - TORNA DA POLLI":"CASSETTA DI POLLI "+crates.length+"/3");
    }
  });
  // parole di Luchino
  if(crew.luchino===1) PAROLE.forEach((p,i)=>{
    if(!words.includes(i) && p[0]===X && p[1]===Y){
      words.push(i); respect+=8;
      toast(words.length>=4?"4/4 PAROLE - TORNA DA LUCHINO":"PAROLA «"+p[2]+"» "+words.length+"/4");
    }
  });
  // sciarpa di Dani
  if(crew.dani===1 && !sciarpa && X===SCIARPA_POS[0] && Y===SCIARPA_POS[1]){
    sciarpa=true; respect+=10; toast("SCIARPA NERAZZURRA - TORNA DA DANI");
  }
  // anelli di Cino
  if(crew.cino===1){
    const r=ANELLI[ringIdx];
    if(r && r[0]===X && r[1]===Y){
      ringIdx++;
      if(ringIdx>=ANELLI.length){
        crew.cino=2; respect+=70; sfx.win();
        toast("CINO E' PRONTO - GIRO CHIUSO!");
      } else toast("ANELLO "+ringIdx+"/8 - AVANTI!");
    }
  }
  MAP_HOOKS.forEach(f=>f(X,Y));
  doSave();
}
function updateMap(){
  if(aPressed){ mapInteract(); return; }
  if(bPressed){ sfx.a(); mode="diario"; return; }
  if(player.moving){
    player.step+=2; player.animT++;
    const [dx,dy]=DIRV[player.dir];
    player.ox=dx*player.step; player.oy=dy*player.step;
    if(player.step>=TS) finishMove();
  } else {
    const d=heldDir();
    if(d) tryMove(d); else player.animT=0;
  }
}

/* ---------- RENDER ---------- */
function drawMap(){
  const camX=Math.max(0,Math.min(player.x*TS+player.ox-72, MW*TS-VW));
  const camY=Math.max(0,Math.min(player.y*TS+player.oy-64, MH*TS-VH));
  const f=(Math.floor(tick/30))%2;
  const tx0=Math.floor(camX/TS), ty0=Math.floor(camY/TS);
  for(let ty=ty0;ty<=ty0+9;ty++){
    for(let tx=tx0;tx<=tx0+10;tx++){
      const t=TILES[tileAt(tx,ty)]||TILES["."];
      ctx.drawImage(t[f], tx*TS-camX, ty*TS-camY);
    }
  }
  // alone dei lampioni e della serra
  ctx.globalAlpha=0.10;
  for(let ty=ty0;ty<=ty0+9;ty++)for(let tx=tx0;tx<=tx0+10;tx++){
    const t=tileAt(tx,ty);
    if(t==="l"){ ctx.fillStyle="#ffd15a";
      ctx.beginPath(); ctx.arc(tx*TS-camX+8, ty*TS-camY+4, 20, 0, Math.PI*2); ctx.fill(); }
    if(t==="v"){ ctx.fillStyle="#73dc63";
      ctx.fillRect(tx*TS-camX-3, ty*TS-camY-3, 22, 22); }
    if(t==="r"){ ctx.fillStyle="#ccff33";
      ctx.fillRect(tx*TS-camX, ty*TS-camY-2, 16, 5); }
  }
  ctx.globalAlpha=1;
  // firme sui muri
  MURI.forEach(w=>{
    const sx=w.x*TS-camX, sy=w.y*TS-camY;
    if(sx<-16||sx>VW||sy<-16||sy>VH) return;
    if(tags.includes(w.id)){
      ctx.fillStyle="#ccff33"; ctx.font="bold 8px 'Courier New',monospace"; ctx.textBaseline="top";
      ctx.fillText("BI", sx+3, sy+4);
    } else if(crew.bisi>=1){
      const p=(Math.floor(tick/12)%2);
      ctx.fillStyle = p?"#ff7a33":"#c85a20";
      ctx.fillRect(sx+5,sy+5,6,6);
    }
  });
  // collezionabili
  const dot=(x,y,col,r)=>{ const sx=x*TS-camX+8, sy=y*TS-camY+8;
    if(sx<-8||sx>VW+8||sy<-8||sy>VH+8) return;
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#0e1210"; ctx.lineWidth=1; ctx.stroke(); };
  TAPPI.forEach((p,i)=>{ if(!caps.includes(i)) dot(p[0],p[1],"#f1c64f",3); });
  BARRE.forEach((p,i)=>{ if(!bars.includes(i)){
    const s=(Math.floor(tick/10)%2)?4:3; dot(p[0],p[1],"#d7a7ff",s); } });
  if(crew.polli===1) CASSETTE.forEach((p,i)=>{ if(!crates.includes(i)){
    const sx=p[0]*TS-camX, sy=p[1]*TS-camY;
    ctx.fillStyle="#64d86f"; ctx.fillRect(sx+3,sy+5,10,7);
    ctx.strokeStyle="#18391e"; ctx.strokeRect(sx+3,sy+5,10,7); } });
  if(crew.luchino===1) PAROLE.forEach((p,i)=>{ if(!words.includes(i)){
    const sx=p[0]*TS-camX, sy=p[1]*TS-camY;
    ctx.fillStyle="rgba(14,18,16,.85)"; ctx.fillRect(sx-8,sy+2,32,10);
    ctx.fillStyle="#d7a7ff"; ctx.font="bold 7px 'Courier New',monospace"; ctx.textBaseline="top";
    ctx.fillText(p[2],sx-5,sy+4); } });
  if(crew.dani===1 && !sciarpa){
    const sx=SCIARPA_POS[0]*TS-camX, sy=SCIARPA_POS[1]*TS-camY;
    ctx.fillStyle="#121a2a"; ctx.fillRect(sx+2,sy+6,12,4);
    ctx.fillStyle="#4aa8ff"; ctx.fillRect(sx+4,sy+6,2,4); ctx.fillRect(sx+9,sy+6,2,4);
  }
  if(crew.cino===1 && ringIdx<ANELLI.length){
    const r=ANELLI[ringIdx];
    const sx=r[0]*TS-camX+8, sy=r[1]*TS-camY+8;
    ctx.strokeStyle="#ff596a"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(sx,sy, 8+(Math.floor(tick/8)%3), 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle="#ff596a"; ctx.font="bold 8px 'Courier New',monospace"; ctx.textBaseline="top";
    ctx.fillText(String(ringIdx+1), sx-2, sy-4);
  }
  // la crew
  CHARS.forEach(c=>{
    ctx.drawImage(c.spr[c.dir][0], c.x*TS-camX, c.y*TS-camY-2);
    const sx=c.x*TS-camX, sy=c.y*TS-camY;
    if(sx>-16&&sx<VW&&sy>-10&&sy<VH){
      ctx.fillStyle=c.col; ctx.fillRect(sx+6, sy-7, 4, 3);
    }
  });
  const frame = player.moving ? Math.floor(player.animT/6)%4 : 0;
  ctx.drawImage(SPR[player.dir][frame], player.x*TS+player.ox-camX, player.y*TS+player.oy-camY-2);
  DRAW_HOOKS.forEach(f=>f(camX,camY));
  // HUD respect
  ctx.fillStyle="rgba(14,18,16,.85)"; ctx.fillRect(2,2,52,12);
  ctx.strokeStyle="#ccff33"; ctx.lineWidth=1; ctx.strokeRect(2.5,2.5,51,11);
  ctx.fillStyle="#ccff33"; ctx.font="bold 8px 'Courier New',monospace"; ctx.textBaseline="top";
  ctx.fillText("RSP "+respect,6,5);
  // toast
  if(toastT>0){
    ctx.fillStyle="rgba(14,18,16,.92)"; ctx.fillRect(2,16,156,12);
    ctx.strokeStyle="#ffd15a"; ctx.strokeRect(2.5,16.5,155,11);
    ctx.fillStyle="#ffd15a"; ctx.font="bold 7px 'Courier New',monospace";
    ctx.fillText(toastMsg, 6, 19);
  }
}
function textBox(lines){
  const h = lines.length>3 ? 48 : 38;
  const y = 142-h;
  ctx.fillStyle="#101614"; ctx.fillRect(2,y,156,h);
  ctx.strokeStyle="#ccff33"; ctx.lineWidth=2; ctx.strokeRect(3,y+1,154,h-2);
  ctx.fillStyle="#e8e4d8"; ctx.font="bold 9px 'Courier New',monospace"; ctx.textBaseline="top";
  lines.slice(0,4).forEach((l,i)=>ctx.fillText(l, 8, y+5+i*10));
}
function drawDiario(){
  ctx.fillStyle="#0d1512"; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle="#ccff33"; ctx.font="bold 10px 'Courier New',monospace"; ctx.textBaseline="top";

  if(diarioPage===0){
    const order=BASE_CREW.concat(Object.keys(CREWDEF).filter(k=>!BASE_CREW.includes(k)));

      const y=19+i*10, d=CREWDEF[k];
      const st = k==="marro" ? (finalDone?2:(prologue?1:0)) : crew[k];
      ctx.fillStyle=d.col; ctx.fillRect(6,y+2,6,5);
      ctx.fillStyle="#e8e4d8"; ctx.fillText(d.name, 16, y);
      ctx.fillStyle = st>=2?"#ccff33":(st===1?"#ffd15a":"#5a6660");
      ctx.fillText(st>=2?"FATTO":(st===1?"IN CORSO":"DA TROVARE"), 84, y);
    });
  } else {
    let y=22;
    ctx.fillStyle="#8fa89a";
    ctx.fillText("MURI  "+tags.length+"/8", 8, y); y+=11;
    ctx.fillText("TAPPI "+caps.length+"/"+TAPPI.length, 8, y); y+=11;
    ctx.fillText("BARRE "+bars.length+"/"+BARRE.length, 8, y); y+=11;
    STAT_LINES.forEach(f=>{ const t=f&&f(); if(t){ ctx.fillText(t, 8, y); y+=11; } });
    const mi=missione();
    y=Math.max(y+4,96);
    ctx.fillStyle="#ffd15a";
    ctx.fillText("\u00bb "+mi[0], 8, y);
    ctx.fillText("  "+mi[1], 8, y+10);
  }
  ctx.fillStyle="#8fa89a";
  ctx.fillText("\u25c0\u25b6 pagina   A/B: esci", 8, 134);
}
function drawEnding(){
  const grad=ctx.createLinearGradient(0,0,0,VH);
  grad.addColorStop(0,"#2a3550"); grad.addColorStop(.55,"#5a4a4a"); grad.addColorStop(1,"#c88a4a");
  ctx.fillStyle=grad; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle="#ffd15a"; ctx.beginPath(); ctx.arc(130,96,10,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#0e1210"; ctx.fillRect(0,104,VW,40);

  ctx.font="bold 8px 'Courier New',monospace"; ctx.fillStyle="#cfc8b8";
  ctx.fillText("Per qualche minuto",8,54);
  ctx.fillText("Monzoro non e' una",8,64);
  ctx.fillText("frazione: e' tutto",8,74);
  ctx.fillText("quello che serve.",8,84);
  ctx.fillStyle="#ffd15a";
  ctx.fillText("CREW "+pronti()+"/6  MURI "+tags.length+"/8  "+compl+"%",8,110);
  ctx.fillText("TAPPI "+caps.length+"/"+TAPPI.length+"  BARRE "+bars.length+"/"+BARRE.length,8,121);
  ctx.fillStyle="#8fa89a";
  ctx.fillText("A/B: continua il giro",8,133);
}
function draw(){
  ctx.clearRect(0,0,VW,VH);
  if(mode==="simon"){ drawSimon(); return; }
  if(mode==="timing"){ drawTiming(); return; }
  if(mode==="arrows"){ drawArrows(); return; }
  if(mode==="quiz"){ drawQuiz(); return; }
  if(mode==="diario"){ drawDiario(); return; }
  if(mode==="ending"){ drawEnding(); return; }
  if(MINIGAMES[mode]){ MINIGAMES[mode].draw(); return; }
  drawMap();
  if(mode==="dialog") textBox(dialog.lines);
}

  if(G.phase==="ko" && aPressed){ G.i=0; G.sel=0; G.ok=0; G.phase="q"; sfx.a(); }
}

/* ---------- ESAME: disegno ---------- */
function testa(t){
  ctx.fillStyle="#0c141c"; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle="#9ad8ff"; ctx.font="bold 8px 'Courier New',monospace"; ctx.textBaseline="top";
  ctx.fillText(t,6,4);
  ctx.fillStyle="#25415a"; ctx.fillRect(0,25,VW,1);
}
function righe(txt,x,y,col,pass){
  ctx.fillStyle=col; ctx.font="bold 7px 'Courier New',monospace";
  txt.split("|").forEach((l,i)=>ctx.fillText(l,x,y+i*(pass||10)));
}
function drawEsame(){
  if(!G) return;
  testa("ESAME DI BIOMECCANICA");
  const q=ESAME[G.i];
  ctx.font="bold 8px 'Courier New',monospace";
  if(G.phase==="ko"){
    ctx.fillStyle="#ff596a"; ctx.fillText("BOCCIATO: "+G.ok+" SU 5",6,15);
    righe("BUCCIA: ne servivano|quattro. Il corpo umano non|fa sconti e io ancora meno.|La buona notizia e' che le|risposte te le ho appena|spiegate tutte. Rifallo.",
      6,40,"#cfe6f5");
    ctx.fillStyle="#8fa89a"; ctx.font="bold 8px 'Courier New',monospace";
    ctx.fillText("A: si ricomincia  B: esco",6,132);
    return;
  }
  ctx.fillStyle="#8fa89a";
  ctx.fillText("DOMANDA "+(G.i+1)+"/5   GIUSTE "+G.ok,6,15);
  if(G.phase==="q"){
    righe(q.q,6,32,"#e8e4d8");
    q.o.forEach((o,i)=>{
      const sel=(i===G.sel);
      if(sel){ ctx.fillStyle="#1b3348"; ctx.fillRect(4,70+i*16,152,13); }
      ctx.fillStyle = sel ? "#ffd15a" : "#8fa89a";
      ctx.font="bold 7px 'Courier New',monospace";
      ctx.fillText((sel?"> ":"  ")+o, 8, 73+i*16);
    });
    ctx.fillStyle="#8fa89a"; ctx.font="bold 8px 'Courier New',monospace";
    ctx.fillText("A: rispondi  B: esco",6,132);
    return;
  }
  ctx.font="bold 9px 'Courier New',monospace";
  ctx.fillStyle = G.giusta ? "#73dc63" : "#ff596a";
  ctx.fillText(G.giusta ? "ESATTO." : "NO. La risposta era:", 6, 32);
  if(!G.giusta){
    ctx.fillStyle="#ffd15a"; ctx.font="bold 7px 'Courier New',monospace";
    ctx.fillText(q.o[q.ok], 8, 44);
  }
  righe(q.e, 6, G.giusta?46:56, "#cfe6f5");
  ctx.fillStyle="#8fa89a"; ctx.font="bold 8px 'Courier New',monospace";
  ctx.fillText(G.i>=ESAME.length-1?"A: verdetto":"A: domanda dopo",6,132);
}

/* ---------- TARATURA: logica ---------- */
function nuovoBersaglio(){
  G.c = 20 + Math.random()*60;
  G.x = Math.random()*100;
  G.dir = Math.random()<0.5 ? -1 : 1;
}
function startTaratura(){
  G={p:0, x:0, c:50, dir:1, lives:VITE, msg:"", vals:[]};
  nuovoBersaglio();
  mode="buccia_tar"; sfx.a();
}
function tarataFinita(){
  const v=G.vals.slice(), g=S();
  g.tarato=true; g.vals=v; G=null;
  mode="map"; crew.buccia=2; respect+=70; doSave(); sfx.win();
  playScene([
    {lines:["BUCCIA: Tarato.","Rigidezza "+v[0]+" Nm/rad,","ritardo "+v[1]+" ms.","Ti sta addosso."]},
    {lines:["Il costo metabolico","del cammino ti scende","del 9%. In teoria.","In pratica non correre."]},
    {lines:["Il capannone chiude.","Vengo al Mericco col","prototipo e il quaderno.","BUCCIA E' PRONTO!"]}
  ]);
}
function updateTar(){
  if(!G){ mode="map"; return; }
  if(bPressed){ mode="map"; G=null; sfx.b(); return; }
  const t=TAR[G.p];
  G.x += G.dir*t.sp;
  if(G.x>=100){ G.x=100; G.dir=-1; }
  else if(G.x<=0){ G.x=0; G.dir=1; }
  if(aPressed){
    if(Math.abs(G.x-G.c)<=t.w){
      const val = t.lo + (t.hi-t.lo)*G.c/100;
      G.vals[G.p] = t.d ? val.toFixed(1) : String(Math.round(val));
      sfx.hit(); G.msg=t.ok; G.p++;
      if(G.p>=TAR.length){ tarataFinita(); return; }
      nuovoBersaglio();
    } else {
      sfx.miss(); G.lives--;
      if(G.lives<=0){
        G.p=0; G.vals=[]; G.lives=VITE; G.msg="TARATURA PERSA. DA CAPO.";
        S().tent++; doSave();
      } else G.msg="FUORI RANGE. Vite: "+G.lives;
      nuovoBersaglio();
    }
  }
}

/* ---------- TARATURA: disegno ---------- */
function drawTar(){
  if(!G) return;
  const t=TAR[G.p];
  testa("TARATURA DEL MONZ-1");
  ctx.fillStyle="#8fa89a"; ctx.font="bold 8px 'Courier New',monospace";
  ctx.fillText("PARAM "+(G.p+1)+"/4   VITE "+"●".repeat(G.lives),6,15);
  ctx.fillStyle="#9ad8ff";
  ctx.fillText(t.n,6,31);
  // la lancetta e la finestra buona
  const bx=10, bw=140, by=48;
  ctx.fillStyle="#22303c"; ctx.fillRect(bx,by,bw,14);
  ctx.fillStyle="#2ebd77"; ctx.fillRect(bx+bw*(G.c-t.w)/100, by, bw*2*t.w/100, 14);
  ctx.fillStyle="#0e1210";
  for(let i=1;i<4;i++) ctx.fillRect(bx+bw*i/4, by, 1, 14);
  ctx.fillStyle="#ffffff"; ctx.fillRect(bx+bw*G.x/100-1, by-4, 3, 22);
  ctx.strokeStyle="#0e1210"; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,14);
  // esito ultimo tentativo
  ctx.fillStyle = G.msg.indexOf("FUORI")===0||G.msg.indexOf("PERSA")>=0 ? "#ff596a" : "#73dc63";
  ctx.font="bold 8px 'Courier New',monospace";
  ctx.fillText(G.msg||"",6,74);
  // quadro dei parametri gia' bloccati
  ctx.fillStyle="#25415a"; ctx.fillRect(0,86,VW,1);
  ctx.font="bold 7px 'Courier New',monospace";
  TAR.forEach((p,i)=>{
    const fatto = G.vals[i]!==undefined;
    ctx.fillStyle = fatto ? "#cfe6f5" : (i===G.p ? "#ffd15a" : "#4f6470");
    ctx.fillText(p.s, 6, 92+i*9);
    ctx.fillText(fatto ? G.vals[i]+p.u : "- - -", 84, 92+i*9);
  });
  ctx.fillStyle="#8fa89a"; ctx.font="bold 8px 'Courier New',monospace";
  ctx.fillText("A: blocca  B: esco",6,132);
}

registerMinigame("buccia_esame", {update:updateEsame, draw:drawEsame});
registerMinigame("buccia_tar",   {update:updateTar,   draw:drawTar});

/* ---------- MODULO: JAMBO (i sette rigori) ---------- */
(function(){
  const MODE = "rigori";
  const JC = "#2ee6c0";           // maglia di Jambo
  const TOT = 7, NEED = 4;
  /* barra: 0..100. Oltre FUORI il tiro esce, entro PREC e' pulito,
     entro INCR e' l'angolino che non si prende. */
  const FUORI = 24, PREC = 12, INCR = 4;

  addCrew("jambo", {name:"JAMBO", col:"#2ee6c0", cm:{R:"A",B:"G"}, x:37, y:28, home:"Porta del campetto"});

  /* memoria lunga: Jambo si ricorda dove tiri, anche fra una notte e l'altra */
  const EX = EXT.jambo || (EXT.jambo = {});
  if(!EX.z || EX.z.length!==6) EX.z=[0,0,0,0,0,0];
  EX.best = EX.best|0; EX.said = EX.said|0; EX.par = EX.par|0;

  /* ---- geometria della porta ---- */
  const GX0=22, GX1=138, GY0=28, GY1=86;
  const COLX=[44,80,116], ROWY=[44,72], SPOTY=93;
  const CN=["SX","CENTRO","DX"], RN=["ALTO","BASSO"];
  const zone=(c,r)=>r*3+c;

  let st=null;

  /* ---------- la testa di Jambo ---------- */
  function scegliTuffo(){
    const w=[1,1,1,1,1,1];
    // quello che hai gia' fatto stanotte pesa tanto
    st.hist.forEach(z=>{
      w[z]+=2.2;
      const c=z%3; w[c]+=0.9; w[c+3]+=0.9;
    });
    // l'ultimo tiro pesa il doppio: ripetersi e' un lusso
    if(st.hist.length){
      const z=st.hist[st.hist.length-1], c=z%3;
      w[z]+=2.6; w[c]+=1.0; w[c+3]+=1.0;
    }
    // memoria delle notti precedenti, a voce piu' bassa
    const tot=EX.z.reduce((a,b)=>a+b,0);
    if(tot>4) for(let i=0;i<6;i++) w[i]+=EX.z[i]/tot*3.2;
    // un portiere si tuffa piu' volentieri in basso
    for(let i=0;i<3;i++) w[i]*=0.85;
    let pick;
    if(Math.random()<0.15){                     // ogni tanto va d'istinto
      pick=Math.random()*6|0;
    } else {
      const sum=w.reduce((a,b)=>a+b,0);
      let r=Math.random()*sum; pick=5;
      for(let i=0;i<6;i++){ r-=w[i]; if(r<=0){ pick=i; break; } }
    }
    st.jcol=pick%3; st.jrow=pick/3|0;
    // piu' sei avanti, piu' ti vende una finta
    const pf=Math.min(0.55, 0.30+0.08*st.gol);
    st.finta=Math.random()<pf;
    if(st.finta) st.lean = st.jcol===1 ? (Math.random()<0.5?0:2) : (st.jcol===0?2:0);
    else st.lean = st.jcol;
  }

  /* ---------- esito del tiro ---------- */
  function esito(){
    const d=Math.abs(st.bar-50), c=st.col, r=st.row;
    if(d>FUORI) return {kind:"fuori", txt:d>36?"FUORI DI PARECCHIO":"A LATO DI UN NIENTE"};
    if(r===0 && d>PREC) return {kind:"alto", txt:"ALTO SOPRA LA TRAVERSA"};
    const molle = (d>PREC);                       // solo sui tiri bassi
    const sameC = (st.jcol===c), sameZ = sameC && (st.jrow===r);
    const incrocio = (r===0 && d<=INCR);
    if(sameZ && !incrocio) return {kind:"parata", txt:"PARATA! LO SAPEVA."};
    if(sameC && molle)     return {kind:"parata", txt:"TROPPO MOLLE: PRESA!"};
    return {kind:"gol", txt: incrocio?"GOL! SOTTO L'INCROCIO"
      : sameC?"GOL! LA SFIORA E BASTA"
      : molle?"GOL! MA CHE BRIVIDO":"GOL! SPIAZZATO SECCO"};
  }

  function nuovoTiro(){
    st.phase="aim"; st.t=0; st.at=0; st.res=null;
    st.bar=0; st.dir=1;
    scegliTuffo();
  }
  function start(){
    st={tiri:0, gol:0, hist:[], col:1, row:1, msg:"", esiti:[],
        jcol:1, jrow:1, lean:1, finta:false, bar:0, dir:1, t:0, at:0, phase:"aim", res:null};
    nuovoTiro(); mode=MODE; sfx.a();
  }

  function vittoria(){
    const g=st.gol; st=null;
    if(g>EX.best) EX.best=g;
    crew.jambo=2; respect+=60; doSave(); sfx.win();
    playScene([
      {lines:["JAMBO: Quattro gol.","Il campo era molle,","i guanti bagnati e","il pallone sgonfio."]},
      {lines:["Poi quello sotto","l'incrocio non lo","prendeva nessuno.","Nemmeno io da fermo."]},
      {lines:["Va bene, hai vinto.","Ti porto al Mericco.","JAMBO E' PRONTO! ✔"]}
    ]);
  }

  /* ---------- UPDATE ---------- */
  function update(){
    if(!st){ mode="map"; return; }
    if(bPressed){ mode="map"; st=null; sfx.b(); return; }
    const p=st.phase;

    if(p==="aim"){
      st.t++;
      if(dirTapped==="left" && st.col>0){ st.col--; sfx.b(); }
      if(dirTapped==="right" && st.col<2){ st.col++; sfx.b(); }
      if(dirTapped==="up" && st.row>0){ st.row--; sfx.b(); }
      if(dirTapped==="down" && st.row<1){ st.row++; sfx.b(); }
      if(aPressed){ st.phase="power"; st.t=0; st.bar=0; st.dir=1; sfx.pad(2); }
      return;
    }

    if(p==="power"){
      st.t++;
      st.bar += st.dir*(3.4+st.tiri*0.15);
      if(st.bar>=100||st.bar<=0){ st.dir*=-1; st.bar=Math.max(0,Math.min(100,st.bar)); }
      if(aPressed){
        const r=esito();
        st.res=r; st.phase="shoot"; st.at=0;
        st.hist.push(zone(st.col,st.row));
        EX.z[zone(st.col,st.row)]++;
        beep(210,.06,0,.12,"square");
      }
      return;
    }

    if(p==="shoot"){
      st.at++;
      if(st.at===30){
        const r=st.res;
        st.tiri++; st.esiti.push(r.kind);
        if(r.kind==="gol"){ st.gol++; sfx.hit(); beep(1240,.09,.08,.1); }
        else if(r.kind==="parata"){ EX.par++; sfx.miss(); beep(300,.1,.1,.09,"square"); }
        else sfx.miss();
        st.msg=r.txt; st.phase="result"; st.at=0;
      }
      return;
    }

    if(p==="result"){
      st.at++;
      if(st.at>46 || aPressed){
        if(st.tiri>=TOT){
          if(st.gol>=NEED){ vittoria(); return; }
          if(st.gol>EX.best) EX.best=st.gol;
          st.phase="over"; st.msg="SOLO "+st.gol+" GOL SU 7."; doSave();
        } else nuovoTiro();
      }
      return;
    }

    if(p==="over" && aPressed){
      st.tiri=0; st.gol=0; st.esiti=[]; st.hist=[]; st.msg="";
      nuovoTiro(); sfx.a();
    }
  }

  /* ---------- DISEGNO ---------- */
  function keeper(){
    if(st.phase==="over") return {x:80, y:74, ang:0, arm:9};   // allarga le braccia
    if(st.phase==="aim"||st.phase==="power"){
      const tell = (st.phase==="power") || st.t>42;
      if(!tell) return {x:80+Math.sin(st.t/11)*2, y:74, ang:0, arm:6};
      const l=st.lean-1, b=Math.sin(st.t/5)*0.7;
      return {x:80+l*5+b*l, y:74+(l===0?2:0), ang:l*0.16, arm:l===0?9:6};
    }
    const u=Math.min(1, st.at/20), e=u*(2-u);
    return {x:80+(COLX[st.jcol]-80)*e, y:74+((st.jrow===0?46:70)-74)*e,
            ang:(st.jcol-1)*1.2*e, arm:6+5*e};
  }
  function drawKeeper(k){
    ctx.save(); ctx.translate(k.x, k.y); if(k.ang) ctx.rotate(k.ang);
    ctx.fillStyle="#1c6f60"; ctx.fillRect(-4,4,3,9); ctx.fillRect(1,4,3,9);
    ctx.fillStyle="#0e1210"; ctx.fillRect(-4,12,3,2); ctx.fillRect(1,12,3,2);
    const a=Math.round(k.arm);
    ctx.fillStyle=JC; ctx.fillRect(-5-a,-6,a,3); ctx.fillRect(5,-6,a,3);
    ctx.fillStyle="#ffd15a"; ctx.fillRect(-8-a,-7,3,4); ctx.fillRect(5+a,-7,3,4);
    ctx.fillStyle=JC; ctx.fillRect(-5,-6,10,11);
    ctx.fillStyle="#0e1210"; ctx.fillRect(-5,-6,10,1); ctx.fillRect(-1,-5,2,9);
    ctx.fillStyle="#e8c090"; ctx.fillRect(-3,-13,6,6);
    ctx.fillStyle="#0e1210"; ctx.fillRect(-3,-14,6,2);
    ctx.restore();
  }
  function target(){
    const cx=COLX[st.col], cy=ROWY[st.row], k=st.res.kind;
    if(k==="fuori") return [st.bar>50?152:8, cy+4];
    if(k==="alto")  return [cx, 14];
    const q=Math.max(0,(Math.abs(st.bar-50)-10))/24;
    return [cx+(80-cx)*q*0.55, cy+(72-cy)*q*0.4];
  }
  function ballPos(){
    let u=Math.min(1, st.at/28);
    if(st.res.kind==="parata") u=Math.min(u,0.78);
    const [tx,ty]=target();
    return [80+(tx-80)*u, SPOTY+(ty-SPOTY)*u - Math.sin(u*Math.PI)*5, 4.5-2*u];
  }
  function drawBall(x,y,r){
    ctx.fillStyle="#e8e4d8"; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#0e1210"; ctx.lineWidth=1; ctx.stroke();
    if(r>2.6){ ctx.fillStyle="#3a4038"; ctx.fillRect(x-1,y-1,2,2); }
  }

  function draw(){
    if(!st) return;
    ctx.fillStyle="#10151c"; ctx.fillRect(0,0,VW,VH);
    // prato
    ctx.fillStyle="#1e3a22"; ctx.fillRect(0,78,VW,66);
    ctx.fillStyle="#26402a"; ctx.fillRect(0,88,VW,6);
    ctx.fillStyle="#3a5c40"; ctx.fillRect(0,86,VW,1);
    ctx.fillStyle="#2e4a32"; ctx.fillRect(0,96,VW,2);
    // rete
    ctx.fillStyle="#161d26"; ctx.fillRect(GX0,GY0,GX1-GX0,GY1-GY0);
    ctx.fillStyle="#2c3b46";
    for(let x=GX0+4;x<GX1;x+=6) ctx.fillRect(x,GY0+2,1,GY1-GY0-2);
    for(let y=GY0+4;y<GY1;y+=6) ctx.fillRect(GX0+2,y,GX1-GX0-4,1);
    // pali
    ctx.fillStyle="#e8e4d8";
    ctx.fillRect(GX0,GY0,3,GY1-GY0); ctx.fillRect(GX1-3,GY0,3,GY1-GY0);
    ctx.fillRect(GX0,GY0,GX1-GX0,3);
    ctx.fillStyle="#9aa0aa"; ctx.fillRect(GX0,GY0+2,GX1-GX0,1);

    // mirino
    if(st.phase==="aim"||st.phase==="power"){
      const x0=[25,62,99][st.col], x1=[62,99,135][st.col];
      const y0=st.row===0?31:58, y1=st.row===0?58:86;
      const on=(Math.floor(tick/8)%2)===0 || st.phase==="power";
      ctx.strokeStyle=on?"#ffd15a":"#7a6a2a"; ctx.lineWidth=1;
      ctx.strokeRect(x0+1.5,y0+1.5,x1-x0-3,y1-y0-3);
      ctx.fillStyle=on?"#ffd15a":"#7a6a2a";
      const cx=(x0+x1)/2, cy=(y0+y1)/2;
      ctx.fillRect(cx-4,cy,9,1); ctx.fillRect(cx,cy-4,1,9);
    }
    // la rete che si gonfia
    if(st.phase==="result" && st.res.kind==="gol"){
      const [tx,ty]=target(), w=tick%8;
      ctx.strokeStyle="rgba(204,255,51,.55)"; ctx.lineWidth=1;
      for(let i=0;i<3;i++){
        ctx.beginPath(); ctx.arc(tx,ty,4+i*4+w,0,Math.PI*2); ctx.stroke();
      }
    }

    drawKeeper(keeper());
    if(st.phase==="shoot"||st.phase==="result"){
      const b=ballPos(); drawBall(b[0],b[1],Math.max(2.2,b[2]));
    } else if(st.phase!=="over") drawBall(80,SPOTY,4.5);

    // testata
    ctx.font="bold 8px 'Courier New',monospace"; ctx.textBaseline="top";
    ctx.fillStyle="rgba(14,18,16,.8)"; ctx.fillRect(0,0,VW,26);
    ctx.fillStyle=JC; ctx.fillText("SETTE RIGORI A JAMBO",6,3);
    ctx.fillStyle="#8fa89a";
    ctx.fillText("TIRI "+st.tiri+"/"+TOT+"  GOL "+st.gol+"/"+NEED,6,14);
    for(let i=0;i<TOT;i++){
      const e=st.esiti[i];
      ctx.fillStyle = e==="gol"?"#ccff33":(e==="parata"?JC:(e?"#6a4a4a":"#3a4038"));
      ctx.fillRect(104+i*8,15,6,6);
      ctx.strokeStyle="#0e1210"; ctx.lineWidth=1; ctx.strokeRect(104.5+i*8,15.5,5,5);
    }

    // striscia bassa
    ctx.fillStyle="rgba(14,18,16,.88)"; ctx.fillRect(0,98,VW,46);
    ctx.fillStyle="#e8e4d8";
    if(st.phase==="aim"){

/* ---------- MODULO: MARCHINO - LA BATTERIA DELLA CANTINA ---------- */
(function(){

addCrew("marchino", {name:"MARCHINO", col:"#ff9de2", cm:{R:"P",B:"D"}, x:23, y:21, home:"Cantina del Mericco"});

/* I quattro pezzi, dall'alto in basso come su uno spartito.
   charleston e cassa stanno agli estremi, tom e rullante in mezzo. */
const PEZZI = [
  {tasto:"right", gl:"▶", ab:"CHA", col:"#7fe6ff",
   snd:()=>{ beep(1560,.03,0,.05,"square"); beep(2350,.025,.012,.03,"square"); }},
  {tasto:"left",  gl:"◀", ab:"TOM", col:"#ffd15a",
   snd:()=>{ beep(152,.13,0,.16,"triangle"); beep(108,.16,.015,.1,"sine"); }},
  {tasto:"down",  gl:"▼", ab:"RUL", col:"#e8e4d8",
   snd:()=>{ beep(196,.055,0,.14,"sawtooth"); beep(345,.045,.012,.07,"square"); }},
  {tasto:"a",     gl:"A",      ab:"CAS", col:"#ff9de2",
   snd:()=>{ beep(124,.035,0,.15,"square"); beep(52,.17,0,.2,"sine"); }}
];
const TASTO = {right:0, left:1, down:2, a:3};

/* Il groove: due battute di base piu' una con lo stacco sul tom.
   CAS CHA RUL CHA CAS CAS RUL CHA  ->  il tempo sta in piedi da solo. */
const GIRO   = [3,0,2,0,3,3,2,0];
const STACCO = [3,0,2,0,1,1,2,3];
const PATTERN = GIRO.concat(GIRO, STACCO);

const TOT=PATTERN.length, SOGLIA=18;
const BEAT=28;            // frame fra una nota e l'altra (~0,47 s a 60fps)
const VEL=1.2;            // pixel per frame
const LEADIN=132;         // conto iniziale + volo della prima nota
const PERF=5, BUONO=11;   // finestre di giudizio, in frame
const LY=28, LH=18, HITX=38;

let bat=null;

function nuovaCorsa(){
  return {
    note: PATTERN.map((p,i)=>({p:p, t:LEADIN+i*BEAT, g:null})),
    t:0, last:0, pulse:0, conta:0,
    centri:0, perf:0, combo:0, best:0,
    msg:"", msgCol:"#8fa89a", msgT:0,
    lamp:[0,0,0,0], linea:0, fase:"gioco"
  };
}
function startBatteria(){ bat=nuovaCorsa(); mode="batteria"; sfx.a(); }

/* Il loop gira a requestAnimationFrame: qui si ragiona in frame, ma il
   passo lo misura l'orologio, se no a 120Hz la batteria va al doppio. */
function passo(m){
  const now = (window.performance && performance.now) ? performance.now() : Date.now();
  if(!m.last){ m.last=now; return 1; }
  let d=(now-m.last)*0.06; m.last=now;
  if(d>5) d=5; if(d<0) d=0;
  return d;
}

function giudizio(m,txt,col){ m.msg=txt; m.msgCol=col; m.msgT=30; }

function colpo(m,l){
  PEZZI[l].snd(); m.lamp[l]=8;
  let vic=null, dist=1e9;
  for(let i=0;i<m.note.length;i++){
    const n=m.note[i]; if(n.g) continue;
    const d=Math.abs(m.t-n.t);
    if(d<dist){ dist=d; vic=n; }
  }
  if(!vic || dist>BUONO) return;          // colpo a vuoto: suona e basta
  m.linea=8;
  if(vic.p!==l){ vic.g="persa"; m.combo=0; giudizio(m,"PEZZO SBAGLIATO","#ff6a6a"); return; }
  vic.g="presa"; m.centri++; m.combo++;
  if(m.combo>m.best) m.best=m.combo;
  if(dist<=PERF){ m.perf++; giudizio(m,"PERFETTO!","#ccff33"); }
  else giudizio(m,"BUONO","#ffd15a");
}

function fine(m){
  if(m.centri<SOGLIA){ m.fase="esito"; ricorda(m); doSave(); sfx.miss(); return; }
  const c=m.centri, p=m.perf, k=m.best, bis=(crew.marchino>=2);
  mode="map"; ricorda(m); bat=null; sfx.win();
  if(bis){
    openDialog(["MARCHINO: "+c+" su 24.","Meglio di ieri, dai.","Le bacchette","le tieni tu."]);
    doSave(); return;
  }
  crew.marchino=2; respect+=65; doSave();
  playScene([
    {lines:["MARCHINO: "+c+" su 24.","Perfetti "+p+", combo "+k+".",
            p>=15?"Quasi a tempo, quasi.":"Non sei Bonham,",
            p>=15?"Il resto lo copro io.":"ma il pezzo regge."]},
    {lines:["Ti lascio la cantina","e le bacchette buone.","Quelle storte","le uso io."]},
    {lines:["MARCHINO E' DEI","NOSTRI. E adesso","smetti di guardarti","le mani mentre suoni."]}
  ]);
}
function ricorda(m){
  const e = EXT.marchino || (EXT.marchino={});
  if(m.centri>(e.centri|0)) e.centri=m.centri;
  if(m.best>(e.combo|0)) e.combo=m.best;
}

function updateBatteria(){
  const m=bat;
  for(let i=0;i<4;i++) if(m.lamp[i]>0) m.lamp[i]--;
  if(m.linea>0) m.linea--;
  if(m.msgT>0) m.msgT--;
  if(bPressed){ mode="map"; bat=null; sfx.b(); return; }
  if(m.fase==="esito"){
    if(aPressed){ bat=nuovaCorsa(); sfx.a(); }
    return;
  }
  m.t += passo(m);
  // metronomo: quattro colpi di conto, poi un tocco ogni due note
  while(m.pulse < 4+TOT && m.t >= LEADIN-4*BEAT + m.pulse*BEAT){
    const p=m.pulse++;
    if(p<4){ m.conta=p+1; beep(880,.045,0,.07,"square"); }
    else if((p-4)%8===0) beep(660,.03,0,.05,"square");
    else if((p-4)%2===0) beep(660,.025,0,.028,"square");
  }
  // note scappate sotto la linea
  for(let i=0;i<m.note.length;i++){
    const n=m.note[i];
    if(!n.g && m.t > n.t+BUONO){ n.g="persa"; m.combo=0; giudizio(m,"MANCATA","#ff6a6a"); }
  }
  if(dirTapped!==null && TASTO[dirTapped]!==undefined) colpo(m,TASTO[dirTapped]);
  if(aPressed) colpo(m,3);
  if(m.t > LEADIN+(TOT-1)*BEAT+BUONO+18) fine(m);
}

const CONTO=["UNO","DUE","TRE","QUATTRO"];
function drawBatteria(){
  const m=bat;
  ctx.fillStyle="#140f18"; ctx.fillRect(0,0,VW,VH);
  ctx.font="bold 9px 'Courier New',monospace"; ctx.textBaseline="top";
  ctx.fillStyle="#ff9de2"; ctx.fillText("LA BATTERIA DI MARCHINO",5,4);
  ctx.font="bold 8px 'Courier New',monospace"; ctx.fillStyle="#8fa89a";
  ctx.fillText("CENTRI "+m.centri+"/"+SOGLIA+"   COMBO x"+m.combo,6,16);
  // corsie
  for(let i=0;i<4;i++){
    const y=LY+i*LH, cy=y+(LH>>1);
    ctx.fillStyle = (i&1) ? "#1b1420" : "#211a28";
    ctx.fillRect(0,y,VW,LH-1);
    if(m.lamp[i]>0){ ctx.fillStyle="rgba(255,255,255,.34)"; ctx.fillRect(HITX-7,y+1,15,LH-3); }
    ctx.strokeStyle = m.lamp[i]>0 ? PEZZI[i].col : "#463654"; ctx.lineWidth=1;
    ctx.strokeRect(HITX-6.5,y+2.5,14,LH-6);
    ctx.fillStyle = m.lamp[i]>0 ? "#ffffff" : PEZZI[i].col;
    ctx.fillText(PEZZI[i].gl,2,cy-5);
    ctx.fillStyle = m.lamp[i]>0 ? "#ffffff" : "#7d8a84";
    ctx.fillText(PEZZI[i].ab,12,cy-4);
  }
  // note in arrivo (ritagliate: sotto la linea spariscono, non calpestano i nomi)
  ctx.save();
  ctx.beginPath(); ctx.rect(HITX-6,LY-3,VW-HITX+6,4*LH+4); ctx.clip();
  for(let i=0;i<m.note.length;i++){
    const n=m.note[i];
    if(n.g==="presa") continue;
    const x=HITX+(n.t-m.t)*VEL;
    if(x<HITX-14 || x>VW+8) continue;
    const cy=LY+n.p*LH+(LH>>1);
    ctx.fillStyle = n.g ? "#4a3a50" : PEZZI[n.p].col;
    ctx.fillRect(x-5,cy-5,11,11);
    ctx.fillStyle="#140f18"; ctx.fillRect(x-3,cy-3,7,7);
    if(!n.g){ ctx.fillStyle=PEZZI[n.p].col; ctx.fillRect(x-1,cy-1,3,3); }
  }
  ctx.restore();
  // linea di battuta
  ctx.fillStyle = m.linea>0 ? "#ffffff" : "#6b5675";
  ctx.fillRect(HITX-1,LY-3,3,4*LH+4);
  if(m.linea>0){ ctx.fillStyle="rgba(255,157,226,.5)"; ctx.fillRect(HITX-4,LY-3,9,4*LH+4); }
  // giudizio / conto alla rovescia
  ctx.font="bold 9px 'Courier New',monospace";
  if(m.fase==="esito"){
    ctx.fillStyle="#ff6a6a"; ctx.fillText("SOLO "+m.centri+"/24. NE SERVONO "+SOGLIA,6,104);
  } else if(m.t<LEADIN && m.conta>0){
    ctx.fillStyle="#ffd15a"; ctx.fillText(CONTO.slice(0,m.conta).join(" ")+"...",6,104);
  } else if(m.msgT>0){
    ctx.fillStyle=m.msgCol; ctx.fillText(m.msg,6,104);
  }
  // quanti ne servono ancora
  ctx.fillStyle="#2a2230"; ctx.fillRect(8,118,144,5);
  ctx.fillStyle="#ff9de2"; ctx.fillRect(8,118,144*m.centri/TOT,5);
  ctx.fillStyle="#ccff33"; ctx.fillRect(8+((144*SOGLIA/TOT)|0),115,1,11);
  ctx.font="bold 8px 'Courier New',monospace"; ctx.fillStyle="#8fa89a";
  ctx.fillText(m.fase==="esito" ? "A: si rifa'   B: esci" : "Colpisci a tempo  B: esci",6,132);
}
registerMinigame("batteria",{update:updateBatteria, draw:drawBatteria});

  /* ================= LE CINQUE ================= */

  var BESTIE = [
    { id:"zanz", nome:"ZANZARONA", art:"una", f:true, spr:sprZanz,

  function pump(){
    flush();
    var guard = 0;
    while(B && B.q.length && B.q[0].fn && guard++ < 64){ B.q.shift().fn(); flush(); }

    if(B.q.length){ B.cur = B.q[0].m; B.t = 0; B.phase = "msg"; sfx.msg(); return; }

    for(i=0;i<BESTIE.length;i++){ r -= BESTIE[i].w; if(r < 0) return BESTIE[i]; }
    return BESTIE[0];
  }

    BUF = [];
    if(P.seen.indexOf(c.id) < 0) P.seen.push(c.id);
    mode = "battaglia"; sfx.a();
    say(["L'erba alta si muove.", "Sbuca "+c.art+" "+c.nome+"!"]);

  }

  function finish(){
    var P = st();
    P.hp = B.php; P.cool = COOL;
    var done = B.done, c = B.c;
    B = null; BUF = [];
    mode = "map";
    doSave();
    if(done === "win") toast(c.nome+" BATTUT"+(c.f?"A":"O"));
  }

  /* ---- turno della creatura ---- */
  function enemyTurn(){
    if(!B || B.done) return;
    var c = B.c;
    var a = c.atk[Math.random()*c.atk.length|0];
    say([c.nome+" usa", a.n+"!"]);
    act(function(){
      if(Math.random() > (a.p == null ? 1 : a.p)){ say(["Ma ti manca."]); return; }
      if(a.eff === "dodge"){
        B.dodge = true;
        say([c.nome+" si scioglie", "nella nebbia."]);
        return;
      }
      if(a.eff === "stare"){
        if(B.malus < 3) B.malus += 2;
        say(["OTTAVO si sente", "giudicato. Colpisce", "un po' meno forte."]);
        return;
      }
      var d = rnd(a.d[0], a.d[1]);
      B.php -= d; B.pflash = 18; sfx.miss();
      if(a.eff === "steal"){
        if(respect > 0) respect = Math.max(0, respect - 2);
        say(["Ti sfila un tappo", "dalla tasca. -2 RSP."]);
      }
      if(B.php <= 0){ B.php = 0; act(koPlayer); }
    });
  }

  /* ---- turno dell'OTTAVO ---- */
  function playerTurn(mi){
    var m = MOSSE[mi], c = B.c;
    say(["OTTAVO usa", m.n+"!"]);
    act(function(){
      if(B.dodge){
        B.dodge = false;
        say([c.nome+" non e' piu'", "dov'era un attimo fa."]);
        act(enemyTurn); return;
      }
      if(Math.random() > m.p){ say(["Ma va a vuoto."]); act(enemyTurn); return; }
      var d = rnd(m.d[0], m.d[1]) - B.malus;
      if(d < 1) d = 1;
      var note = null;
      if(c.weak === m.n){ d = Math.round(d*1.6); note = "E' superefficace!"; }
      else if(c.res === m.n){ d = Math.round(d*0.4); if(d < 1) d = 1;
        note = c.f ? "Non le fa effetto." : "Non gli fa effetto."; }
      B.chp -= d; B.eflash = 18; sfx.hit();
      if(m.scare) B.scare += m.scare;
      if(note) say([note]);
      act(function(){
        if(B.chp <= 0){ B.chp = 0; koEnemy(); return; }
        if(B.scare >= 2 && Math.random() < 0.5){ scappaVia(); return; }
        enemyTurn();
      });
    });
    pump();
  }

  function koEnemy(){
    var c = B.c, P = st();
    sfx.win();
    say([c.nome, "e' battut"+(c.f?"a":"o")+"!"]);
    act(function(){
      if(P.beat.indexOf(c.id) < 0){
        P.beat.push(c.id); respect += c.rsp;
        say(["Mai vist"+(c.f?"a":"o")+" prima.", "+"+c.rsp+" RSP."]);
      }
      B.done = "win";
    });
  }

  function scappaVia(){
    var c = B.c;
    sfx.b();
    say([c.nome, "e' scappat"+(c.f?"a":"o")+"!"]);
    act(function(){ B.done = "gone"; });
  }

  function koPlayer(){
    sfx.miss();
    say(["OTTAVO e' cotto."]);
    say(["Ti risvegli nell'erba", "con meno RSP e la", "faccia piena di erba."]);
    act(function(){
      respect = Math.max(0, respect - 4);
      B.php = PMAX;
      B.done = "ko";
    });
  }

  function tryFuga(){
    say(["OTTAVO prova a", "svignarsela..."]);
    act(function(){
      if(Math.random() < 0.62){
        sfx.win();
        say(["Via!", "L'erba si richiude."]);
        act(function(){ B.done = "flee"; });
      } else {
        sfx.miss();
        say(["Non ti molla."]);
        act(enemyTurn);
      }
    });

  }

  /* ================= INPUT ================= */

  function update(){
    if(!B){ mode = "map"; return; }
    B.t++;
    if(B.eflash > 0) B.eflash--;
    if(B.pflash > 0) B.pflash--;

    if(B.phase === "msg"){
      var attesa = MSGT + 26 * (B.cur ? B.cur.length : 1);
      if(((aPressed || bPressed) && B.t > 5) || B.t > attesa) advance();
      return;
    }
    if(B.phase === "menu"){
      if((dirTapped === "left" || dirTapped === "up") && B.sel > 0){ B.sel--; sfx.b(); }
      if((dirTapped === "right" || dirTapped === "down") && B.sel < 1){ B.sel++; sfx.b(); }
      if(aPressed){
        sfx.a();
        if(B.sel === 0){ B.phase = "moves"; B.sel = 0; }
        else tryFuga();
      }
      return;
    }
    if(B.phase === "moves"){
      if(dirTapped === "up" && B.sel > 0){ B.sel--; sfx.b(); }
      if(dirTapped === "down" && B.sel < MOSSE.length-1){ B.sel++; sfx.b(); }
      if(bPressed){ sfx.b(); B.phase = "menu"; B.sel = 0; return; }
      if(aPressed){ sfx.a(); playerTurn(B.sel); }
      return;
    }
  }

  /* ================= DISEGNO ================= */

  var STELLE = [[12,4],[31,10],[52,3],[70,14],[88,6],[121,16],[141,9],[26,22],[63,26],[150,29]];
  var CUR = "▶";

  function box(x,y,w,h,col){
    ctx.fillStyle = "#101614"; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle = col || "#ccff33"; ctx.lineWidth = 2;
    ctx.strokeRect(x+1, y+1, w-2, h-2);
  }
  function hpbar(x,y,w,r){
    if(r < 0) r = 0; if(r > 1) r = 1;
    ctx.fillStyle = "#2a2f36"; ctx.fillRect(x,y,w,5);
    ctx.fillStyle = r > .5 ? "#2ebd77" : (r > .2 ? "#ffd15a" : "#d04838");
    ctx.fillRect(x, y, Math.round(w*r), 5);
    ctx.strokeStyle = "#0e1210"; ctx.lineWidth = 1;
    ctx.strokeRect(x+.5, y+.5, w-1, 4);
  }
  function ciuffo(cx,cy,w){
    ctx.fillStyle = "#1d3a24"; ctx.fillRect(cx-w/2, cy, w, 5);
    ctx.fillStyle = "#2f6a3a";
    for(var i=0;i<w;i+=3) ctx.fillRect(cx-w/2+i, cy-3, 1, 4);
    ctx.fillStyle = "#47a055"; ctx.fillRect(cx-w/2, cy, w, 1);
  }

  function draw(){
    if(!B) return;
    var c = B.c, i;

    ctx.fillStyle = "#0b1a12"; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle = "#122a1b"; ctx.fillRect(0,0,VW,90);
    ctx.fillStyle = "#2e4a34";
    for(i=0;i<STELLE.length;i++) ctx.fillRect(STELLE[i][0], STELLE[i][1], 1, 1);

    ciuffo(128, 52, 54);
    ciuffo(32, 86, 58);

    var esh = B.eflash > 0 ? (B.eflash % 4 < 2 ? 2 : -2) : 0;
    if(!(B.eflash > 0 && B.eflash % 6 < 3))
      ctx.drawImage(c.spr, 104 + esh, 4, 48, 48);

    var psh = B.pflash > 0 ? (B.pflash % 4 < 2 ? 2 : -2) : 0;
    if(!(B.pflash > 0 && B.pflash % 6 < 3))
      ctx.drawImage(SPR.up[0], 8 + psh, 39, 48, 48);

    ctx.textBaseline = "top";

    /* riquadro della creatura */
    box(4, 8, 92, 28, "#8fa89a");
    ctx.font = "bold 8px 'Courier New',monospace";
    ctx.fillStyle = "#e8e4d8"; ctx.fillText(c.nome, 9, 12);
    ctx.fillStyle = "#8fa89a"; ctx.font = "bold 7px 'Courier New',monospace";
    ctx.fillText("PV", 9, 24);
    hpbar(22, 24, 66, B.chp / B.cmax);

    /* riquadro dell'OTTAVO */
    box(62, 52, 94, 30, "#ccff33");
    ctx.font = "bold 8px 'Courier New',monospace";
    ctx.fillStyle = "#ccff33"; ctx.fillText("OTTAVO", 67, 56);
    ctx.font = "bold 7px 'Courier New',monospace";
    ctx.fillStyle = "#8fa89a"; ctx.fillText("PV", 67, 68);
    hpbar(80, 68, 46, B.php / PMAX);
    ctx.fillStyle = "#8fa89a"; ctx.fillText(B.php+"/"+PMAX, 128, 68);

    /* riquadro dei messaggi */
    box(2, 90, 156, 52, "#ccff33");

    if(B.phase === "msg" && B.cur){
      ctx.font = "bold 9px 'Courier New',monospace"; ctx.fillStyle = "#e8e4d8";
      for(i=0;i<B.cur.length && i<3;i++) ctx.fillText(B.cur[i], 8, 96 + i*11);
      if(B.t % 30 < 18){
        ctx.fillStyle = "#ffd15a"; ctx.font = "bold 8px 'Courier New',monospace";
        ctx.fillText("▼", 145, 130);
      }
      return;
    }

    if(B.phase === "menu"){
      ctx.font = "bold 8px 'Courier New',monospace"; ctx.fillStyle = "#8fa89a";
      ctx.fillText("CHE SI FA?", 8, 96);
      ctx.fillText("A: scegli", 92, 96);
      ctx.font = "bold 9px 'Courier New',monospace";
      var vo = ["LOTTA","FUGA"];
      for(i=0;i<2;i++){
        var yy = 111 + i*13;
        ctx.fillStyle = B.sel === i ? "#ffd15a" : "#5a6660";
        if(B.sel === i) ctx.fillText(CUR, 10, yy);
        ctx.fillStyle = B.sel === i ? "#e8e4d8" : "#7d8b82";
        ctx.fillText(vo[i], 24, yy);
      }
      return;
    }

    if(B.phase === "moves"){
      ctx.font = "bold 9px 'Courier New',monospace";
      for(i=0;i<MOSSE.length;i++){
        var y2 = 96 + i*13;
        if(B.sel === i){ ctx.fillStyle = "#ffd15a"; ctx.fillText(CUR, 8, y2); }
        ctx.fillStyle = B.sel === i ? "#e8e4d8" : "#7d8b82";
        ctx.fillText(MOSSE[i].n, 20, y2);
      }
      ctx.font = "bold 7px 'Courier New',monospace"; ctx.fillStyle = "#8fa89a";
      ctx.fillText(MOSSE[B.sel].tag, 116, 98);
      ctx.fillText("B: torna", 116, 110);
      ctx.fillText("A: colpisci", 106, 122);
      return;
    }
  }

  registerMinigame("battaglia", {update:update, draw:draw});

  /* ================= AGGANCIO ALL'ERBA ALTA ================= */

  onStep(function(x, y){
    if(mode !== "map") return;
    var P = st();
    P.reg++;
    if(P.reg >= REG){ P.reg = 0; if(P.hp < PMAX) P.hp++; }
    if(P.cool > 0){ P.cool--; return; }
    if(tileAt(x, y) !== "G") return;
    if(Math.random() < RATE) start();
  });

  addStatLine(function(){
    var P = st();
    return "BESTIARIO " + P.seen.length + "/" + BESTIE.length +
           "  BATTUTE " + P.beat.length;
  });
  addStatLine(function(){
    var P = st();
    return "PV OTTAVO " + (B ? B.php : P.hp) + "/" + PMAX;
  });

})();

(function(){

const DIRS   = ["down","left","up","right"];

/* ---------- musica: sequencer a sedicesimi ---------- */
const NT = {"-":0,

function music(s, sec){
